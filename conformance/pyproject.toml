[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strictcli-conformance"
version = "0.11.0"
description = "Conformance validation tool for strictcli"
requires-python = ">=3.12"
dependencies = ["strictcli", "jsonschema"]
keywords = ["rlsbl"]

[project.scripts]
conformance = "conformance_tool:main"

# The conformance-meta gate check runs these tests via `uv run`, so pytest must
# resolve inside this project's environment. Without the declaration it silently
# fell through to whatever pytest happened to be on PATH -- present on a dev box,
# absent in CI.
[dependency-groups]
dev = ["pytest"]

[tool.uv.sources]
strictcli = { path = "../python", editable = true }

[tool.setuptools]
packages = ["conformance_tool"]
